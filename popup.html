<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
    }
    
    .container {
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
      margin: 0 0 15px 0;
      color: #333;
      font-size: 18px;
      text-align: center;
    }
    
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    
    label {
      font-weight: bold;
      color: #333;
      margin: 0;
    }
    
    .toggle {
      position: relative;
      width: 50px;
      height: 26px;
      background-color: #ccc;
      border-radius: 13px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .toggle.enabled {
      background-color: #667eea;
    }
    
    .toggle-slider {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background-color: white;
      border-radius: 50%;
      transition: left 0.3s;
    }
    
    .toggle.enabled .toggle-slider {
      left: 27px;
    }
    
    .status {
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      margin-top: 10px;
    }
    
    .status.enabled {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .status.disabled {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .info {
      background-color: #e7f3ff;
      border-left: 4px solid #2196F3;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      color: #0c5460;
      margin-top: 15px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Proxer.me Autoplay</h1>
    
    <div class="toggle-container">
      <label for="autoplay-toggle">Autoplay aktivieren:</label>
      <div class="toggle" id="autoplay-toggle">
        <div class="toggle-slider"></div>
      </div>
    </div>
    
    <div class="status disabled" id="status">Deaktiviert</div>
    
    <div class="info">
      <strong>Funktionen:</strong>
      <ul style="margin: 5px 0; padding-left: 18px;">
        <li>Erkennt Episodenende</li>
        <li>Lädt nächste Episode</li>
        <li>Startet Vollbildmodus</li>
      </ul>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
